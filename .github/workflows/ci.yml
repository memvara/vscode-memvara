# Merge gate. release.yml calls this workflow so a tag cannot skip the suite.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read skill.lock and hooks.lock
        id: lock
        run: |
          echo "sha=$(awk -F= '/^sha=/{print $2}' skill.lock)" >> "$GITHUB_OUTPUT"
          echo "hooks=$(awk -F= '/^sha=/{print $2}' hooks.lock)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: memvara/memvara
          ref: ${{ steps.lock.outputs.sha }}
          path: _library

      # `test_the_vendored_skill_is_not_behind_the_library` needs the library's CURRENT
      # default branch, and the checkout above is pinned to skill.lock's sha -- so without
      # this it cannot resolve `origin/main` locally and falls through to the GitHub API.
      # Unauthenticated calls are capped at 60/hour and Actions runners share IPs, so that
      # call can answer 403, and the test then SKIPS: "drift NOT checked: HTTP Error 403".
      #
      # It is intermittent rather than constant -- 23 of 23 recent runs across these repos
      # did resolve it, and claude-memvara skipped once in twelve. That is the argument FOR
      # removing the dependence rather than against it: a guard that runs most of the time
      # is one whose green cannot be read as "checked", and the failure is silent enough
      # that the run it skipped was found by accident.
      #
      # One shallow ref, no token, no API. `--depth 1` because only the tip's tree is read.
      - name: Fetch the library's default branch, so the drift check cannot skip
        run: git -C _library fetch --depth 1 origin main:refs/remotes/origin/main

      # The checkout above is pinned to skill.lock's sha. The hook guards compare against
      # hooks.lock's, which is a different commit and is not an object in that shallow
      # clone -- so without this they fall through to the unauthenticated GitHub API,
      # capped at 60/hour against an IP the runners share, and SKIP rather than check.
      # Reproduced in this family: "vendored bytes NOT checked: HTTP Error 403: rate limit
      # exceeded". It does not skip every run, which is the argument FOR this step rather
      # than against it -- a guard that checks most of the time is one whose green cannot
      # be read as "checked", and this is the guard that proves the vendored bytes are the
      # library's.
      #
      # Soft on purpose: fetching a sha unreachable from any remote ref fails, and that
      # would turn a guard which skips with a printed reason into a red job and a git
      # error naming neither hooks nor drift. This step is an optimisation, not a check.
      - name: Fetch the library commit hooks.lock pins, so the hook guards cannot skip
        run: git -C _library fetch --depth 1 origin ${{ steps.lock.outputs.hooks }} || true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Test
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          MEMVARA_LIBRARY: ${{ github.workspace }}/_library
        run: python3 -m unittest discover -s test -v
